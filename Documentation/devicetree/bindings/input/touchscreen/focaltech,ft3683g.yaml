%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft3683g.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FocalTech FT3683G SPI touchscreen controller

maintainers:
  - Your Name <you@example.com>

description:
  FocalTech FT3683G touchscreen controller connected over SPI. Coordinates
  are reported in 1/16 pixel units, so touchscreen-size-x/y must be the
  panel resolution multiplied by 16.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: focaltech,ft3683g

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active high reset line.

  avdd-supply:
    description: Analog power supply.

  vddio-supply:
    description: I/O power supply.

  spi-max-frequency:
    maximum: 12000000

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - avdd-supply
  - vddio-supply
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "focaltech,ft3683g";
            reg = <0>;
            spi-max-frequency = <12000000>;
            interrupt-parent = <&tlmm>;
            interrupts = <98 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 96 GPIO_ACTIVE_HIGH>;
            avdd-supply = <&ts_avdd>;
            vddio-supply = <&ts_vddio>;
            touchscreen-size-x = <19520>;
            touchscreen-size-y = <43392>;
        };
    };
