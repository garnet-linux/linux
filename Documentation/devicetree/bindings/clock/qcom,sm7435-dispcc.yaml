%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm7435-dispcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Display Clock & Reset Controller on SM7435

maintainers:
  - ximi <ximiyadka124@proton.me>

description: |
  Qualcomm display clock control module provides the clocks, resets and power
  domains on SM7435.

  See also: include/dt-bindings/clock/qcom,sm7435-dispcc.h

properties:
  compatible:
    const: qcom,sm7435-dispcc

  clocks:
    items:
      - description: Board XO source
      - description: Board active-only XO source
      - description: Sleep clock source
      - description: Byte clock from DSI PHY0
      - description: Pixel clock from DSI PHY0
      - description: Link clock from DP PHY0
      - description: VCO div clock from DP PHY0
      - description: Link clock from DP PHY1
      - description: VCO div clock from DP PHY1
      - description: Link clock from DP PHY2
      - description: VCO div clock from DP PHY2
      - description: Link clock from DP PHY3
      - description: VCO div clock from DP PHY3

  clock-names:
    items:
      - const: bi_tcxo
      - const: bi_tcxo_ao
      - const: sleep_clk
      - const: dsi0_phy_pll_out_byteclk
      - const: dsi0_phy_pll_out_dsiclk
      - const: dp0_phy_pll_link_clk
      - const: dp0_phy_pll_vco_div_clk
      - const: dp1_phy_pll_link_clk
      - const: dp1_phy_pll_vco_div_clk
      - const: dp2_phy_pll_link_clk
      - const: dp2_phy_pll_vco_div_clk
      - const: dp3_phy_pll_link_clk
      - const: dp3_phy_pll_vco_div_clk

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    clock-controller@af00000 {
        compatible = "qcom,sm7435-dispcc";
        reg = <0x0af00000 0x20000>;
        clocks = <&bi_tcxo>, <&bi_tcxo>, <&sleep_clk>,
                 <&dsi0_phy 0>, <&dsi0_phy 1>,
                 <0>, <0>, <0>, <0>, <0>, <0>, <0>, <0>;
        clock-names = "bi_tcxo", "bi_tcxo_ao", "sleep_clk",
                      "dsi0_phy_pll_out_byteclk",
                      "dsi0_phy_pll_out_dsiclk",
                      "dp0_phy_pll_link_clk", "dp0_phy_pll_vco_div_clk",
                      "dp1_phy_pll_link_clk", "dp1_phy_pll_vco_div_clk",
                      "dp2_phy_pll_link_clk", "dp2_phy_pll_vco_div_clk",
                      "dp3_phy_pll_link_clk", "dp3_phy_pll_vco_div_clk";
        #clock-cells = <1>;
        #reset-cells = <1>;
        #power-domain-cells = <1>;
    };
...
