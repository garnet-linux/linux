%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-sm7435.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller on SM7435

maintainers:
  - Ximi <ximiyadka124@proton.me>
    # GitHub: @garnet-linux (organisation), @ximiyadka123 (personal)

description: |
  Qualcomm global clock control module provides the clocks, resets and power
  domains on SM7435.

  Only the clocks needed by the UFS host controller and the QMP UFS PHY are
  implemented at the moment.

  See also: include/dt-bindings/clock/qcom,gcc-sm7435.h

properties:
  compatible:
    enum:
      - qcom,gcc-sm7435

  clocks:
    items:
      - description: 19.2 MHz TCXO
      - description: UFS Phy Rx symbol 0 clock source
      - description: UFS Phy Rx symbol 1 clock source
      - description: UFS Phy Tx symbol 0 clock source
    minItems: 1
    maxItems: 4

  clock-names:
    items:
      - const: bi_tcxo
      - const: ufs_phy_rx_symbol_0_clk
      - const: ufs_phy_rx_symbol_1_clk
      - const: ufs_phy_tx_symbol_0_clk
    minItems: 1
    maxItems: 4

required:
  - compatible
  - clocks
  - clock-names
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sm7435.h>
    clock-controller@100000 {
      compatible = "qcom,gcc-sm7435";
      reg = <0x00100000 0x001f4200>;
      clocks = <&xo_19m2>;
      clock-names = "bi_tcxo";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };

...
